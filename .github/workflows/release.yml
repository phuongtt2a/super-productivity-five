name: Publish plugin release
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose release version
        id: version
        shell: bash
        run: |
          TAG="v$(python -c 'import json; print(json.load(open("plugin/manifest.json"))["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Test and build release ZIP
        run: |
          python -m unittest discover -s tests -v
          node --test tests/behavior.test.cjs
          node --check plugin/plugin.js
          python -c "from pathlib import Path; s=Path('plugin/index.html').read_text(); Path('/tmp/five-inline.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/five-inline.js
          python scripts/package.py --tag "${{ steps.version.outputs.tag }}"
      - name: Publish GitHub Release with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" \
              dist/five-super-productivity.zip \
              --target "$GITHUB_SHA" \
              --title "Five $TAG" \
              --notes "Five — the first stable release. Choose five priorities for today, then focus on one task at a time. Download the installable ZIP from Assets." \
              --latest
          fi
