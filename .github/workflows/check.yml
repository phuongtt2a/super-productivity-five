name: Check plugin
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify package and manifest
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --test tests/behavior.test.cjs
          node --check plugin/plugin.js
          python -c "from pathlib import Path; s=Path('plugin/index.html').read_text(); Path('/tmp/five-inline.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/five-inline.js
      - name: Build installable ZIP
        run: python scripts/package.py
